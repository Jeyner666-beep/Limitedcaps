<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Limited Caps · Verificación auténtica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff}
body{min-height:100vh;min-height:100svh;font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;color:#111;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 22px)}
.logo{height:96px;width:auto;background:#fff}
.brand{font-size:15px;font-weight:600;letter-spacing:.55em;text-transform:uppercase;margin:4px 0 0;padding-left:.55em}
.rule{width:56px;height:1px;background:linear-gradient(90deg,transparent,#777,transparent);margin:12px 0 6px}
.wrap{position:relative;width:100%;max-width:440px;flex:1;display:flex;min-height:230px}
.stage{flex:1;position:relative;background:#fff;overflow:hidden}
.s{position:absolute;inset:0;background:center/contain no-repeat;opacity:0;transform-origin:50% 60%;animation:fade 10.5s linear infinite both,swing 2.8s ease-in-out infinite alternate both;will-change:transform,opacity}
@keyframes fade{0%{opacity:0}7%{opacity:1}14.3%{opacity:1}21.4%,100%{opacity:0}}
@keyframes swing{from{transform:perspective(800px) rotateY(-10deg) rotateZ(-1deg) scale(1) translateY(1.5%)}to{transform:perspective(800px) rotateY(10deg) rotateZ(1deg) scale(1.08) translateY(-2.5%)}}
.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.5) 50%,transparent 62%);mix-blend-mode:screen;transform:translateX(-110%);animation:glint 1.5s ease-in-out infinite;pointer-events:none}
@keyframes glint{0%{transform:translateX(-110%)}55%,100%{transform:translateX(110%)}}
.dol{position:absolute;width:46px;height:auto;z-index:2;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));animation:fl 1.8s ease-in-out infinite alternate}
.d1{top:2px;right:0}.d2{bottom:2px;left:0;animation-delay:-.8s;width:38px}
@keyframes fl{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-8px) rotate(8deg)}}
@media(prefers-reduced-motion:reduce){.s,.dol,.stage:after{animation:none}.s:first-child{opacity:1}.stage:after{display:none}}
.card{width:100%;max-width:440px;margin-top:8px;text-align:center;padding:10px 18px 6px}
.seal{width:66px;height:66px;filter:drop-shadow(0 3px 6px rgba(31,170,89,.35));animation:pop 1.8s ease-in-out infinite alternate}@keyframes pop{from{transform:scale(1)}to{transform:scale(1.08)}}
.card h1{font-size:30px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;margin:10px 0 2px}
.sub{font-size:14px;letter-spacing:.38em;text-transform:uppercase;color:#666;margin:0 0 18px;padding-left:.38em}
.pill{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:13px 28px;font-size:18px;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
</style></head><body>
